name: Validate package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: bash -n tools/connect-wifi.sh
      - run: python scripts/verify_client.py
  recovery-client:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_recovery.py
      - run: tools/bin/mtkwifi-recovery --selftest
      - run: codesign --verify --strict tools/bin/mtkwifi-recovery
